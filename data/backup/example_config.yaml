version: '2.0.0'

DEFAULT:
  tmdb_api: "TMDB_API_KEY"
  add_trailer: false
  add_logo: true
  default_torrent_client: "Client1"
  sfx_on_prompt: true

SCREENS:
  imgbb_api: "imgbb_API_KEY"
  ptpimg_api: "ptpimg_API_KEY"
  lensdump_api: "lensdump_API_KEY"
  ptscreens_api: "ptscreens_API_KEY"
  onlyimage_api: "onlyimage_API_KEY"
  img_host_1: "imgbb"
  img_host_2: "ptpimg"
  img_host_3: "imgbox"
  img_host_4: "pixhost"
  img_host_5: "lensdump"
  img_host_6: "ptscreens"
  img_host_7: "onlyimage"
  screen_count: 6
  per_episode: 3 # for tv will take x screens for every episode put them in spoiler
  img_size: 500
  optimize_images: true
  tonemap_hdr: true
  deinterlace_method: "yadif"
  hdr_method: "reinhard:desat=0" # Other presets: "hable:desat=0" (color accurate but dark) or "mobius:desat=10" (more pop sometimes) , or try your own!

SIGNATURES:
  use_global_sigs: default # Use custom per tracker, fallback to global (False, only use tracker sigs if avail / True, only use global)
  global_sig: "\n[center][url=https://codeberg.org/CvT/Uploadrr][img=400]https://i.ibb.co/2NVWb0c/uploadrr.webp[/img][/url][/center]"
  global_anon_sig: "\n[center][url=https://codeberg.org/CvT/Uploadrr][img=40]https://i.ibb.co/n0jF73x/hacker.png[/img][/url][/center]"
  global_pr_sig: "\n[center][size=6][b]Personal Release[/b][/size][/center]\n[center][url=https://codeberg.org/CvT/Uploadrr][img=400]https://i.ibb.co/2NVWb0c/uploadrr.webp[/img][/url][/center]"
  global_anon_pr_sig: "\n[center][url=https://codeberg.org/CvT/Uploadrr][img=40]https://i.ibb.co/n0jF73x/hacker.png[/img][/url][/center]"

AUTO:
  description_folder: null # "Path/To/description/folder" see wiki for details
  delay: 0
  size_tolerance: 1
  dupe_similarity: 80
  always_aid: true

TRACKERS:
  default_trackers: "LDU, AITHER, BLU, HHD, LST, PSS, RF, FNP, SP"

  ### NOTE: Any tracker can add any of the following options
  ###    signature: ""#    anon_signature: ""#    pr_signature: ""#    anon_pr_signature: ""#
  ###    qbit_tag: ""# <-- for qbit tagging
  ###    modq: true# this can be added, but beware not all trackers support

  ACM:
    api_key: "ACM_API_KEY"
    anon: false

  AITHER:
    api_key: "ATHER_API_KEY"
    anon: false
    modq: false

  ANT:
    PID: "Custom_Announce_URL"
    api_key: "ANT_API_KEY"
    anon: false

  AR:
    PID: "Custom_Announce_URL" # {Custom_Announce_URL}/announce
    username: "username"
    password: "password"

  BHD:
    PID: "Custom_Announce_URL"
    api_key: "BHD_API_KEY"
    draft_default: true
    anon: false

  BHDTV:
    PID: "https://trackerr.bit-hdtv.com/announce" # {Custom_Announce_URL}
    api_key: "found under https://www.bit-hdtv.com/my.php"
    my_announce_url: "https://trackerr.bit-hdtv.com/passkey/announce"
    anon: false

