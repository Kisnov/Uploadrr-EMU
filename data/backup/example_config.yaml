version: '2.0.0'

DEFAULT:
  tmdb_api: "TMDB_API_KEY"
  add_trailer: false
  add_logo: true
  default_torrent_client: "Client1"
  sfx_on_prompt: true

SCREENS:
  imgbb_api: "imgbb_API_KEY"
  ptpimg_api: "ptpimg_API_KEY"
  lensdump_api: "lensdump_API_KEY"
  ptscreens_api: "ptscreens_API_KEY"
  oeimg_api: "oeimg_API_KEY"
  img_host_1: "imgbb"
  img_host_2: "ptpimg"
  img_host_3: "imgbox"
  img_host_4: "pixhost"
  img_host_5: "lensdump"
  img_host_6: "ptscreens"
  img_host_7: "oeimg"
  screens: "6"
  img_size: "500"
  optimize_images: true

SIGNATURES:
  # Setting to false will use signature types under trackers
  use_global_sigs: true
  global_sig: "\n[center][url=https://codeberg.org/CvT/Uploadrr][img=400]https://i.ibb.co/2NVWb0c/uploadrr.webp[/img][/url][/center]"
  global_anon_sig: "\n[center][url=https://codeberg.org/CvT/Uploadrr][img=40]https://i.ibb.co/n0jF73x/hacker.png[/img][/url][/center]"
  global_pr_sig: "\n[center][size=6][b]Personal Release[/b][/size][/center]\n[center][url=https://codeberg.org/CvT/Uploadrr][img=400]https://i.ibb.co/2NVWb0c/uploadrr.webp[/img][/url][/center]"
