name: Claude

# Claude responde cuando Kisnov lo menciona (@claude) en un issue o un PR.
on:
  issue_comment: # zizmor: ignore[dangerous-triggers] solo lo dispara Kisnov (if del job)
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

jobs:
  claude:
    if: github.event.comment.user.login == 'Kisnov' && contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      # En un PR de un fork no actúa: no podría subir a su rama y su código correría con permiso de escritura.
      - id: pr
        if: github.event.issue.pull_request || github.event.pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: echo "fork=$([ "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.repo.full_name)" != "$GITHUB_REPOSITORY" ] && echo true)" >> "$GITHUB_OUTPUT"
      - if: steps.pr.outputs.fork != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - if: steps.pr.outputs.fork != 'true'
        uses: anthropics/claude-code-action@6d5ae526d25ce88daa2200be073e1a373167f064 # v1.0.265
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
