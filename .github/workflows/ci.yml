name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt ruff==0.17.3 pytest==9.2.0 pytest-cov==7.1.0
      # Solo errores que rompen en ejecución (sintaxis, nombres sin definir).
      # El estilo lo revisa CodeRabbit sobre las líneas cambiadas.
      - run: ruff check --select E9,F63,F7,F82 --output-format github .
      - run: python -m compileall -q .
      # Sin red ni ffmpeg/mediainfo: tests/conftest.py corta cualquier salida.
      - run: pytest --cov=src --cov-report=term-missing --cov-report=xml
      # Hasta que la app de Codecov y CODECOV_TOKEN estén puestos, este paso falla sin tumbar el CI.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
