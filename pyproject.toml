[project]
name = "uploadrr"
version = "2.0.0"
description = "Prepara y sube películas y series a eMuwarez (UNIT3D). Derivado de Uploadrr y Upload-Assistant de L4G."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.11.2",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 135
select = ["E", "W", "F", "I"]
target-version = "py39"

[tool.ruff.format]
skip-magic-trailing-comma = true
preview = true

indent-style = "space"
quote-style = "double"