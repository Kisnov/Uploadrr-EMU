[project]
name = "uploadrr"
version = "2.0.0"
description = "Torrent prepration for Movies, TV and Music. Forked from L4G."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.11.2",
]

[tool.ruff]
line-length = 135
select = ["E", "W", "F", "I"]
target-version = "py39"

[tool.ruff.format]
skip-magic-trailing-comma = true
preview = true

indent-style = "space"
quote-style = "double"